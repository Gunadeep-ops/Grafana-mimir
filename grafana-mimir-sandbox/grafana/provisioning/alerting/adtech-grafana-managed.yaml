# The GM rules are created through the API by ./gm-editable.sh so they can be EDITED in the UI.
# (Rules loaded from a provisioning file are always read-only in the UI.)
# This file only removes any old read-only, file-provisioned copies on Grafana start.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: gm-exchange-low-bids
  - orgId: 1
    uid: gm-exchange-b-bids
  - orgId: 1
    uid: gm-exchange-low-winrate
  - orgId: 1
    uid: gm-campaign-low-impressions
