# Grafana-managed alert rules for the PoC. Defaults: No data -> NoData, Error -> Error.
apiVersion: 1
groups:
  - orgId: 1
    name: adtech-grafana-managed
    folder: AdTech PoC
    interval: 30s
    rules:
      - uid: gm-exchange-low-bids
        title: GM ExchangeLowBidRequests
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: A, expr: 'sum by (exchange) (rate(bid_requests_total[2m]))', instant: true, range: false, datasource: { type: prometheus, uid: mimir }, intervalMs: 1000, maxDataPoints: 43200 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [10] } } ] }
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels: { ruleset: grafana, severity: warning }
        annotations: { summary: 'Bid requests from {{ $labels.exchange }} below 10/s' }

      - uid: gm-exchange-b-bids
        title: GM exchange_b BidRequests (single series)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: A, expr: 'sum(rate(bid_requests_total{exchange="exchange_b"}[2m]))', instant: true, range: false, datasource: { type: prometheus, uid: mimir }, intervalMs: 1000, maxDataPoints: 43200 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [10] } } ] }
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels: { ruleset: grafana, severity: warning }
        annotations: { summary: 'Bid requests from exchange_b below 10/s' }

      - uid: gm-exchange-low-winrate
        title: GM ExchangeLowWinRate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: A, expr: 'sum by (exchange) (rate(bids_won_total[2m])) / sum by (exchange) (rate(bid_responses_total[2m]))', instant: true, range: false, datasource: { type: prometheus, uid: mimir }, intervalMs: 1000, maxDataPoints: 43200 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [0.05] } } ] }
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels: { ruleset: grafana, severity: warning }
        annotations: { summary: 'Win rate on {{ $labels.exchange }} below 5%' }

      - uid: gm-campaign-low-impressions
        title: GM CampaignLowImpressions
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: A, expr: 'sum by (campaign_id) (rate(impressions_total[2m]))', instant: true, range: false, datasource: { type: prometheus, uid: mimir }, intervalMs: 1000, maxDataPoints: 43200 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [0.01] } } ] }
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels: { ruleset: grafana, severity: warning }
        annotations: { summary: 'Campaign {{ $labels.campaign_id }} is not serving' }
