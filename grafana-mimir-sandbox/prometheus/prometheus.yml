global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: adtech-app
    static_configs:
      - targets: ["adtech-app:8000"]
  - job_name: mimir
    static_configs:
      - targets: ["mimir:9009"]

remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: sandbox   # must match TENANT_ID in .env
