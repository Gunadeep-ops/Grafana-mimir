# BEFORE: how our Mimir rules are written today.
# Alerts on low impressions, but stays SILENT if the data disappears or the rule fails.
namespace: adtech
groups:
  - name: campaigns
    interval: 30s
    rules:
      - alert: LowImpressions
        expr: sum(rate(impressions_total{job="adtech-app"}[2m])) < 5
        for: 1m
        labels:
          severity: critical
          team: adtech
        annotations:
          summary: "Impressions below 5/s"
